<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diguin_n · TikTok</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="img/normal.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  :root {
    --page-bg:
      radial-gradient(500px 360px at 8% 0%, #25f4ee26, transparent 70%),
      radial-gradient(500px 360px at 95% 10%, #fe2c5530, transparent 70%),
      #000;
    --glow: #25f4eeaa;
    --cy: #25f4ee; --pk: #fe2c55;
  }
  /* efeito "glitch" ciano + rosa do TikTok */
  h1 { text-shadow: -3px 0 0 var(--cy), 3px 3px 0 var(--pk); }
  .cta { background: #fff; color: #000; box-shadow: -5px 0 0 var(--cy), 5px 0 0 var(--pk); }
  section h2 { text-shadow: -2px 0 0 var(--cy), 2px 0 0 var(--pk); }

  .feed { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .vid { position: relative; display: block; aspect-ratio: 9 / 16; border-radius: 14px; overflow: hidden; background: #111;
         text-decoration: none; border: 1px solid #ffffff1c; transition: transform .15s, box-shadow .2s; }
  .vid:hover, .vid:focus-visible { transform: translateY(-4px); box-shadow: -4px 0 0 var(--cy), 4px 0 0 var(--pk); outline: none; }
  .vid img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .vid::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 45%, #000c); }
  .vid .t { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 1; font-weight: 800; font-size: 14px; line-height: 1.25;
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .vid .pl { position: absolute; z-index: 1; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 50%; background: #0007; display: grid; place-items: center; }
  .vid .pl svg { width: 16px; height: 16px; fill: #fff; }
  .note { margin-top: 14px; font-size: 14px; opacity: .7; text-align: center; font-weight: 700; }
</style>
</head>
<body>
<main>
  <a class="back" href="index.html">← Início</a>

  <div class="head">
    <img src="img/polegar_cima.webp" alt="Avatar Diguin_n com o polegar para cima">
    <div>
      <h1>TikTok</h1>
      <p>Cortes rápidos das lives e dicas</p>
    </div>
  </div>

  <a class="cta" id="follow" target="_blank" rel="noopener">Seguir no TikTok</a>

  <section>
    <h2>Últimos vídeos</h2>
    <div class="feed" id="feed"></div>
    <p class="note">Os vídeos completos estão no perfil ↑</p>
  </section>

  <footer>n_n</footer>
</main>

<script src="site.js"></script>
<script>
  const url = SITE.links.tiktok;
  document.getElementById("follow").href = url;
  SITE.ready.then(() => {
    document.getElementById("feed").innerHTML = SITE.shorts.map(s => `
      <a class="vid" href="${url}" target="_blank" rel="noopener">
        <img src="${thumb(s.id)}" alt="" loading="lazy">
        <span class="pl">${ICON.play}</span>
        <span class="t">${esc(s.title)}</span>
      </a>`).join("");
  });
</script>
</body>
</html>
